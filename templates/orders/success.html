{% extends 'base.html' %}

{% block content %}

<style>

.success-container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.success-icon{
    font-size:80px;
    color:green;
    animation: pop 0.6s ease;
}

@keyframes pop{
    0%{
        transform:scale(0);
    }
    100%{
        transform:scale(1);
    }
}

.order-id{
    background:#f8f8f8;
    padding:12px;
    border-radius:8px;
    font-size:18px;
    margin:20px 0;
    font-weight:bold;
}

.btn-container{
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.success-btn{
    background:#ffd814;
    color:black;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.success-btn:hover{
    background:#f7ca00;
}

.invoice-btn{
    background:#232f3e;
    color:white;
}

.invoice-btn:hover{
    background:#131921;
}

.track-btn{
    background:#28a745;
    color:white;
}

.track-btn:hover{
    background:#218838;
}

@media(max-width:768px){

    .success-container{
        margin:20px;
        padding:25px;
    }

    .success-icon{
        font-size:60px;
    }
}

</style>

<div class="success-container">

    <div class="success-icon">
        ✅
    </div>

    <h2>Order Placed Successfully 🎉</h2>

    <p>
        Thank you for shopping with us.
        Your order has been placed successfully.
    </p>

    <div class="order-id">
        Order ID: #{{ order.id }}
    </div>

    <p>
        We will notify you when your order is shipped.
    </p>

    <div class="btn-container">

        <a href="/" class="success-btn">
            🏠 Continue Shopping
        </a>

        <a href="/orders/track/" class="success-btn track-btn">
            🚚 Track Order
        </a>

        <a href="/orders/invoice/" class="success-btn invoice-btn">
            📄 Download Invoice
        </a>

    </div>

</div>

{% endblock %}
