{% extends 'base.html' %}

{% block content %}

<style>
.cart-container {
    display: flex;
    gap: 20px;
}

.cart-items {
    flex: 3;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 8px;
}

.cart-summary {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 8px;
}

.qty-btn {
    padding: 5px 10px;
    background: #eee;
    text-decoration: none;
    margin: 0 5px;
}

.delete-btn {
    color: red;
    text-decoration: none;
}
.delete-link {
    color: #007185;
    text-decoration: none;
    font-size: 14px;
}

.delete-link:hover {
    color: #c7511f;
    text-decoration: underline;
}
/* ===== RESPONSIVE CART ===== */

@media (max-width: 768px) {

    .cart-container {
        flex-direction: column;
    }

    .cart-summary {
        margin-top: 20px;
    }

    .cart-item {
        flex-direction: column;
        gap: 10px;
    }

    .cart-item div:last-child {
        text-align: left;
    }
}

@media (max-width: 480px) {

    .cart-item {
        padding: 10px;
    }

    .cart-item h4 {
        font-size: 15px;
    }

    .qty-btn {
        padding: 4px 8px;
        font-size: 14px;
    }

    .cart-summary {
        padding: 15px;
    }

    .cart-summary button {
        font-size: 14px;
    }

    .cart-item{
        flex-direction:column;
        align-items:flex-start;
    }

    .cart-item img{
        width:100px;
        height:100px;
    }

    .cart-container{
        flex-direction:column;
    }

    .cart-summary{
        width:100%;
    }
}
.checkout-btn{
    width:100%;
    padding:14px;
    background:#FFD814;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.checkout-btn:hover{
    background:#F7CA00;
    transform:translateY(-2px);
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.checkout-btn:active{
    transform:scale(0.98);
}
</style>

<h2>Your Shopping Cart 🛒</h2>

<div class="cart-container">

    <!-- LEFT SIDE -->
    {% for item in items %}
<div class="cart-item">

    <div style="display:flex; gap:20px; align-items:center;">

        <img src="{{ item.product.image.url }}"
             alt="{{ item.product.name }}"
             style="
                width:120px;
                height:120px;
                object-fit:cover;
                border-radius:8px;
                border:1px solid #ddd;
             ">

        <div>
            <h4>{{ item.product.name }}</h4>

            <p style="font-size:18px;color:#B12704;font-weight:bold;">
                ₹{{ item.product.price }}
            </p>

            <div>
                <a class="qty-btn" href="/cart/decrease/{{ item.id }}/">-</a>
                <strong>{{ item.quantity }}</strong>
                <a class="qty-btn" href="/cart/increase/{{ item.id }}/">+</a>
            </div>

            <br>

            <a href="/cart/remove/{{ item.product.id }}/" class="delete-link">
                Remove
            </a>
        </div>

    </div>

   

</div>
    {% empty %}
        <p>Your cart is empty</p>
        {% endfor %}

    </div>

    <!-- RIGHT SIDE -->
    <div class="cart-summary">
        <h3>Order Summary</h3>
        <hr>
        <p><strong>Total: ₹{{ total }}</strong></p>

        <a href="/orders/">
    <button class="checkout-btn">
        🔒 Proceed to Pay
    </button>
</a>
    </div>

</div>

{% endblock %}
