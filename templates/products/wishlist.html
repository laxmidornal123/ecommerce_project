{% extends 'base.html' %}

{% block content %}

<style>

.wishlist-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.wishlist-card{
    background:white;
    padding:15px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.wishlist-card img{
    width:100%;
    height:180px;
    object-fit:contain;
}

.price{
    color:#B12704;
    font-weight:bold;
}

/* Tablet */
@media (max-width:768px){
    .wishlist-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

/* Mobile */
@media (max-width:480px){
    .wishlist-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .wishlist-card img{
        height:120px;
    }

    .wishlist-card h4{
        font-size:14px;
    }
}

</style>

<h2>❤️ My Wishlist</h2>

<div class="wishlist-grid">

{% for item in items %}
<div class="wishlist-card">

    <img src="{{ item.product.image.url }}">

    <h4>{{ item.product.name }}</h4>

    <p class="price">₹{{ item.product.price }}</p>

</div>
{% empty %}
<p>Your wishlist is empty.</p>
{% endfor %}

</div>

{% endblock %}
